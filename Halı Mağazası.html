  +'</div></section>'
  +'<section id="iletisim" class="contact"><div class="wrap"><div class="l"><span class="mono" style="color:var(--text)">İletişim</span><h2>Mağazaya uğrayın.</h2><p class="serif">Halıyı yerinde görün, ölçünüzü birlikte belirleyelim.</p></div>'
  +'<div class="box"><dl><div><dt class="mono">Adres</dt><dd>'+esc(S.shop.address)+'</dd></div><div><dt class="mono">Telefon</dt><dd>'+esc(S.shop.phone)+'</dd></div><div><dt class="mono">Çalışma saatleri</dt><dd>'+esc(S.shop.hours)+'</dd></div></dl>'
  +(gl?'<div><a class="pill primary" href="'+esc(gl)+'" target="_blank" rel="noopener">WhatsApp ile yazın</a></div>':'')+'</div></div></section>'
  +'<footer><div class="wrap"><span class="mono">© '+esc(S.shop.name)+'</span><button class="lnk" data-act="open">Yönetim</button></div></footer>';
}

/* ---------- Yönetim paneli ---------- */
function sizeMB(){return new Blob([JSON.stringify(draft)]).size/1048576;}
function renderPanel(){
  if(!draft){$panel.innerHTML='';document.body.style.overflow='';return;}
  var old=$panel.querySelector('.pb'),top=old?old.scrollTop:0;
  var mb=sizeMB();
  var body;
  if(tab==='urun'){
    var kats=cats().filter(function(c){return c!=='Tümü';});
    body='<p class="hint">Fiyat, ad, boyut ve resimleri değiştirin. Değişiklikler <b>Kaydet ve yayınla</b> düğmesine basana kadar sitede görünmez.</p>'
    +'<datalist id="kats">'+kats.map(function(k){return '<option value="'+esc(k)+'">';}).join('')+'</datalist>'
    +draft.products.map(function(p,i){
      var u=safeImg(p.img),id='p'+i;
      return '<div class="row" data-i="'+i+'"><div class="thumb">'+media(p,i)+'</div><div class="fields">'
      +'<label for="'+id+'-ad">Ürün adı<input id="'+id+'-ad" data-f="ad" value="'+esc(p.ad)+'"></label>'
      +'<label for="'+id+'-kat">Kategori<input id="'+id+'-kat" data-f="kat" list="kats" value="'+esc(p.kat)+'"></label>'
      +'<label for="'+id+'-boyut">Boyut<input id="'+id+'-boyut" data-f="boyut" value="'+esc(p.boyut)+'"></label>'
      +'<label for="'+id+'-malzeme">Malzeme<input id="'+id+'-malzeme" data-f="malzeme" value="'+esc(p.malzeme)+'"></label>'
      +'<label for="'+id+'-fiyat">Fiyat (₺)<input id="'+id+'-fiyat" data-f="fiyat" type="number" inputmode="numeric" min="0" step="1" value="'+esc(p.fiyat)+'"></label>'
      +'<label class="chk" for="'+id+'-t"><input id="'+id+'-t" data-f="tukendi" type="checkbox"'+(p.tukendi?' checked':'')+'> Tükendi</label></div>'
      +'<div class="acts"><label class="pill out sm filebtn" for="'+id+'-img">'+(u?'Resmi değiştir':'Resim ekle')+'<input class="vh" id="'+id+'-img" type="file" accept="image/*" data-file="1"></label>'
      +(u?'<button class="pill out sm" data-act="rmimg">Resmi kaldır</button>':'')
      +(confirmDel===p.id?'<button class="pill sm" style="background:var(--danger);color:var(--bg)" data-act="delok">Silmeyi onayla</button><button class="pill out sm" data-act="delno">Vazgeç</button>':'<button class="pill out sm" data-act="del">Ürünü sil</button>')
      +'</div></div>';
    }).join('')
    +'<div><button class="pill out" data-act="add">+ Ürün ekle</button></div>';
  }else{
    body='<p class="hint">Bu bilgiler üst barda, iletişim bölümünde ve ürünlerdeki WhatsApp düğmelerinde kullanılır. Numaraları rakamlarla yazın, örneğin 0532 000 00 00. WhatsApp numarası için kayıt gerekir: numarayı girmezseniz düğmeler iletişim bölümüne gider.</p>'
    +'<div class="shopf">'
    +'<label for="s-name">Mağaza adı<input id="s-name" data-s="name" value="'+esc(draft.shop.name)+'"></label>'
    +'<label for="s-phone">Telefon / WhatsApp<input id="s-phone" data-s="phone" inputmode="tel" value="'+esc(draft.shop.phone)+'"></label>'
    +'<label for="s-wa">WhatsApp numarası<input id="s-wa" data-s="whatsapp" inputmode="tel" placeholder="Boşsa telefon numarası kullanılır" value="'+esc(draft.shop.whatsapp)+'"></label>'
    +'<label for="s-adr">Adres<textarea id="s-adr" data-s="address">'+esc(draft.shop.address)+'</textarea></label>'
    +'<label for="s-hours">Çalışma saatleri<input id="s-hours" data-s="hours" value="'+esc(draft.shop.hours)+'"></label></div>';
  }
  $panel.innerHTML='<div class="ov" role="dialog" aria-modal="true" aria-label="Yönetim paneli"><div class="pnl">'
  +'<div class="ph"><h2>Yönetim paneli</h2><button class="pill out sm" data-act="close">Kapat</button></div>'
  +'<div class="pt" role="tablist"><button class="seg'+(tab==='urun'?' on':'')+'" role="tab" aria-selected="'+(tab==='urun')+'" data-act="tab" data-v="urun">Ürünler</button><button class="seg'+(tab==='magaza'?' on':'')+'" role="tab" aria-selected="'+(tab==='magaza')+'" data-act="tab" data-v="magaza">Mağaza bilgileri</button></div>'
  +'<div class="pb">'+body+'</div>'
  +'<div class="pf"><span class="stat'+(statusErr?' err':'')+'" role="status">'+esc(status||('Sayfa boyutu: '+mb.toFixed(1).replace('.',',')+' MB / 16 MB'))+'</span>'
  +'<button class="pill primary" data-act="save"'+(saving||mb>15?' disabled':'')+'>'+(saving?'Yayınlanıyor…':'Kaydet ve yayınla')+'</button></div></div></div>';
  document.body.style.overflow='hidden';
  var nb=$panel.querySelector('.pb');if(nb)nb.scrollTop=top;
}
function setStatus(t,err){status=t||'';statusErr=!!err;}

async function openPanel(){
  try{
    var u=window.claude&&window.claude.use?await window.claude.use('user'):null;
    if(u&&typeof u.canEdit==='function'&&!u.canEdit()){flash('Bu sayfayı yalnızca sayfa sahibi düzenleyebilir.');return;}
  }catch(e){}
  draft=clone(S);tab='urun';confirmDel=null;setStatus('');renderPanel();
}
function closePanel(){draft=null;confirmDel=null;setStatus('');renderPanel();}

function toImg(file,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
      var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.82));};
      im.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

function buildDoc(){
  var css=document.getElementById('css').textContent,code=document.getElementById('code').textContent;
  var seed=JSON.stringify(S).replace(/</g,'\\u003c');
  var reset='';
  var sts=document.head.querySelectorAll('style');
  for(var i=0;i<sts.length;i++){if(sts[i].textContent.indexOf('[hidden]')>=0){reset=sts[i].textContent;break;}}
  var T='<'+'script',E='<'+'/script>';
  var link='<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:wght@300;400&display=swap" rel="stylesheet">';
  var content='<title>'+esc(document.title)+'</title>'+link+'<style id="css">'+css+'</style><div id="site" lang="tr"></div><div id="panel" lang="tr"></div><div id="toast" class="toast" role="status" hidden></div>'
    +T+' type="application/json" id="seed">'+seed+E+T+' id="code">'+code+E;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+content+'</body></html>';
}

async function save(){
  if(saving||!draft)return;
  var cl=window.claude&&window.claude.use?await window.claude.use('artifact'):null;
  if(!cl){setStatus('Yayınlama bu görünümde kullanılamıyor. Sayfayı Claude içinde açın.',true);renderPanel();return;}
  S.shop=clone(draft.shop);
  S.products=clone(draft.products).map(function(p){return {id:p.id,ad:String(p.ad||'').trim()||'Adsız ürün',kat:String(p.kat||'').trim()||'Diğer',boyut:String(p.boyut||'').trim(),malzeme:String(p.malzeme||'').trim(),fiyat:Math.max(0,Math.round(Number(p.fiyat)||0)),tukendi:!!p.tukendi,img:safeImg(p.img)};});
  saving=true;setStatus('Yayınlanıyor…');renderPanel();
  try{
    await cl.publish(buildDoc());
    setStatus('Yayınlandı. Sayfa yenileniyor…');renderPanel();
  }catch(e){
    saving=false;
    var c=e&&e.code;
    setStatus(c==='conflict'?'Sayfa başka bir yerden değişmiş. Sayfayı yenileyip tekrar deneyin.':(c==='not_granted'||c==='not_writer')?'Bu sayfayı yayınlama yetkiniz yok.':'Yayınlanamadı. Biraz sonra tekrar deneyin.',true);
    renderPanel();
  }
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,row=t.closest('.row'),i=row?+row.dataset.i:-1;
  if(a==='filter'){filter=t.dataset.v;renderSite();var s=document.querySelector('.seg.on');if(s)s.focus();}
  else if(a==='open')openPanel();
  else if(a==='close')closePanel();
  else if(a==='tab'){tab=t.dataset.v;renderPanel();}
  else if(a==='add'){draft.products.push({id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1000),ad:'Yeni halı',kat:'Klasik',boyut:'160×230 cm',malzeme:'',fiyat:0,tukendi:false,img:''});renderPanel();var pb=$panel.querySelector('.pb');if(pb)pb.scrollTop=pb.scrollHeight;}
  else if(a==='del'){confirmDel=draft.products[i].id;renderPanel();}
  else if(a==='delno'){confirmDel=null;renderPanel();}
  else if(a==='delok'){draft.products.splice(i,1);confirmDel=null;renderPanel();}
  else if(a==='rmimg'){draft.products[i].img='';renderPanel();}
  else if(a==='save')save();
});
document.addEventListener('input',function(e){
  var t=e.target;if(!draft)return;
  if(t.dataset.s){draft.shop[t.dataset.s]=t.value;return;}
  if(t.dataset.f){
    var r=t.closest('.row');if(!r)return;
    var p=draft.products[+r.dataset.i];
    p[t.dataset.f]=t.type==='checkbox'?t.checked:(t.type==='number'?(t.value===''?0:Number(t.value)):t.value);
  }
});
document.addEventListener('change',async function(e){
  var t=e.target;if(!draft||!t.dataset.file)return;
  var r=t.closest('.row'),f=t.files&&t.files[0];if(!r||!f)return;
  try{draft.products[+r.dataset.i].img=await toImg(f,900);setStatus('');}
  catch(err){setStatus('Resim okunamadı. Başka bir dosya deneyin.',true);}
  renderPanel();
});

renderSite();
})();
</script>

</body></html>
